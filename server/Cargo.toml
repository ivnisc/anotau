[package]
name = "anotau-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cargo-dist publica solo el cliente; el servidor se instala en la VM con server/deploy/.
[package.metadata.dist]
dist = false

[dependencies]
anotau-protocol = { path = "../protocol" }
argon2 = "0.5"
getrandom = "0.4"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-server = { version = "=0.9.2", features = ["tls-rustls-ring"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", default-features = false, features = ["io-util", "test-util"] }

[lints]
workspace = true
