[package]
name = "anotau"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository = "https://github.com/ivnisc/anotau"

[workspace]
members = ["server", "protocol"]
default-members = ["."]
exclude = ["work/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[dependencies]
anotau-protocol = { path = "protocol" }
anyhow = "1"
getrandom = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ego-tree = "0.11"
latex2mathml = "=0.2.3"
open = { version = "=5.3.2", features = ["shellexecute-on-windows"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
rat-text = "=3.1.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
scraper = { version = "=0.29.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# los tests del cliente ejercitan la API de dominio contra la SQLite real del servidor
anotau-server = { path = "server" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
tempfile = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
redundant_clone = "warn"
unwrap_used = "warn"

# perfil de los binarios distribuidos por cargo-dist.
[profile.dist]
inherits = "release"
lto = "thin"
